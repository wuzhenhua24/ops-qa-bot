# ops-qa-bot 配置文件模板
# 复制为 config.toml 后填入实际值。config.toml 已被 .gitignore。
# 所有字段都可以通过环境变量覆盖，优先级：环境变量 > 本文件 > 默认值。
# 这样 app_secret 这类敏感信息也可以只走环境变量，不写进文件。

# 文档根目录（相对或绝对路径）。env: DOCS_ROOT
docs_root = "./docs"

[feishu]
app_id     = "cli_xxxxxxxxxxxxxxxx"   # env: FEISHU_APP_ID (必填)
app_secret = "xxxxxxxxxxxxxxxx"       # env: FEISHU_APP_SECRET (必填)

# 可选：事件订阅的 Verification Token（飞书开放平台"事件与回调"页配置的）
# 消息事件 + 卡片回调走统一 /feishu/webhook，两边 Token 必须一致
verify_token = ""                     # env: FEISHU_VERIFY_TOKEN

# 可选但强烈推荐（尤其公网部署）：飞书"事件订阅"页的 Encrypt Key。
# 设置后服务会对入站请求做 AES 解密 + SHA256 签名校验，防止篡改/伪造。
# 飞书平台必须也同时启用 encrypt_key 才会加密推送，否则保持空串即可。
encrypt_key = ""                      # env: FEISHU_ENCRYPT_KEY

[server]
host = "0.0.0.0"                      # env: HOST
port = 8000                           # env: PORT

[session]
idle_ttl = 1800                       # env: SESSION_IDLE_TTL（秒，默认 30 分钟）

[admin]
# /admin/* 接口保护 token。不设时接口开放（适合纯内网部署）。
token = ""                            # env: ADMIN_TOKEN

[logging]
main_log     = "./logs/ops_qa_bot.log"  # env: LOG_FILE
feedback_log = "./logs/feedback.log"    # env: FEEDBACK_LOG

# 长连接模式专用：监控用的小 HTTP 服务，暴露 /healthz /readyz /admin/sessions
# HTTP 模式（run_server.py）已经自带这几个端点，本节配置不影响 HTTP 模式
[health]
enabled = true                          # env: HEALTH_ENABLED；不需要监控时设 false
host    = "127.0.0.1"                   # env: HEALTH_HOST；接外部监控时改 0.0.0.0
port    = 8001                          # env: HEALTH_PORT

# 可选：外部「飞书文档问答」服务（POST /doc_qa）接入。
# 部分组件负责人用飞书文档而非本地 markdown 维护知识——在 docs/INDEX.md 里把这些
# 组件的「来源」列标成 feishu、「飞书文档」列填 doc token，bot 就会用 query_feishu_doc
# 工具去查。base_url 留空则整个特性关闭（不挂工具，无飞书文档需求的部署零感知）。
[doc_qa]
base_url = ""                           # env: DOC_QA_BASE_URL，如 http://127.0.0.1:8800（不带末尾 /doc_qa）
token    = ""                           # env: DOC_QA_TOKEN，对端 HTTP_API_TOKEN；对端没开鉴权则留空
timeout  = 60                           # env: DOC_QA_TIMEOUT（秒）。要 ≥ 对端最坏耗时（内部还要跑 agent + 拉图）

# 可选：网关链路排查接口（cat logview）接入。网关组件文档里有一套人工排查流程
# （拿失败响应头的 Hi-Trace-Id 去 cat 页面查链路）；配上 base_url 后 bot 会挂一个
# query_gateway_trace 工具，用户报告"访问失败 + 给了 Hi-Trace-Id"时确定性地取链路
# 日志。base_url 留空则整个特性关闭。内部环境无鉴权，无 token 字段。
[gateway_trace]
base_url = ""                           # env: GATEWAY_TRACE_BASE_URL，如 http://10.164.200.155:8080（不带末尾 /cat/...）
timeout  = 15                           # env: GATEWAY_TRACE_TIMEOUT（秒）。logview GET 很快，默认 15s 足够

# 可选：数据库只读分析接入。部署机本身装了 mysql / obclient 客户端；asker 在问题里给
# 连接信息（IP/端口/租户/集群），bot 用这里配的【只读账号】直连目标库跑只读 SQL
# （工具 query_database），做 CPU 高/连接数高/慢查询等实时排查。只读由数据库账号权限
# 强制（写操作引擎直接拒），bot 不做 SQL 白/黑名单，agent 可自由迭代地查。
#
# allowed_hosts 为空则整个特性关闭（无此需求的部署零感知）；它把 bot 能连到的实例限在
# 测试环境白名单内（配合“生产天生隔离”做边界）。还需至少配一套只读账号才会真正启用。
# 密码经 MYSQL_PWD 注入、不进命令行/日志/agent 上下文，敏感值建议只走环境变量。
#
# 参数变更审批（可选、独立的更高权限能力）：asker 申请改某实例参数 → bot 用【admin 账号】
# 拼出 SET GLOBAL / ALTER SYSTEM SET 语句 → 发确认卡到群里 → 只有 admin_open_ids 名单里
# 的人点“确认执行”才真正改（执行在飞书回调里、不在 agent 进程内，agent 全程只提议不执行）。
# 要启用需三条都齐：allowed_hosts 非空 + admin_open_ids 非空 + 至少一套 admin 账号。
# admin_open_ids 与文档负责人（INDEX.md owner）刻意解耦——改库参数和答归档问题是两个量级的权限。
[database]
# 允许连接的目标 IP / 网段（CIDR）白名单。env: DB_ALLOWED_HOSTS（逗号分隔，整体覆盖本列表）
allowed_hosts    = []                   # 如 ["10.10.0.0/16", "172.28.65.2"]
query_timeout    = 30                   # env: DB_QUERY_TIMEOUT（秒）。一条 SQL 的连接+执行硬上限
max_result_chars = 20000                # env: DB_MAX_RESULT_CHARS。单次结果返回上限，超出截断防灌爆上下文
# 有权点“确认执行”参数变更的飞书 open_id 白名单（DBA / 库管理员，非文档负责人）。
# 为空则参数变更审批整体关闭。env: DB_ADMIN_OPEN_IDS（逗号分隔，整体覆盖本列表）
admin_open_ids   = []                   # 如 ["ou_xxx", "ou_yyy"]

# 各连接类型的账号：ro_*（只读，跑诊断 SQL）与 admin_*（写权限，执行已审批的参数变更）。
# 哪套 ro 没配，对应类型查询报“未配置只读账号”；admin_* 没配则该类型不能走参数变更审批。
# 原生 MySQL（mysql client）
[database.mysql]
ro_user        = ""                     # env: DB_MYSQL_RO_USER
ro_password    = ""                     # env: DB_MYSQL_RO_PASSWORD
admin_user     = ""                     # env: DB_MYSQL_ADMIN_USER（参数变更才需要）
admin_password = ""                     # env: DB_MYSQL_ADMIN_PASSWORD
# OceanBase mysql 模式（obclient，连接形如 -urw_review@bd_p1#hx_new）
[database.ob_mysql]
ro_user        = ""                     # env: DB_OB_MYSQL_RO_USER
ro_password    = ""                     # env: DB_OB_MYSQL_RO_PASSWORD
admin_user     = ""                     # env: DB_OB_MYSQL_ADMIN_USER
admin_password = ""                     # env: DB_OB_MYSQL_ADMIN_PASSWORD
# OceanBase oracle 模式（obclient，连接形如 -uSYS@zj#qd_dev_00001）
[database.ob_oracle]
ro_user        = ""                     # env: DB_OB_ORACLE_RO_USER
ro_password    = ""                     # env: DB_OB_ORACLE_RO_PASSWORD
admin_user     = ""                     # env: DB_OB_ORACLE_ADMIN_USER
admin_password = ""                     # env: DB_OB_ORACLE_ADMIN_PASSWORD
